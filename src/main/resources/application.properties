spring.application.name=portal-patrocinador-pa
server.port=${PORT:8080}
app.python-etl.url=${PYTHON_ETL_URL:http://localhost:8000}

# 1. Conexão com o Banco PostgreSQL no Supabase (Session Pooler em São Paulo)
spring.datasource.url=jdbc:postgresql://aws-1-sa-east-1.pooler.supabase.com:5432/postgres
spring.datasource.username=${DB_USERNAME:postgres.jaohpsnvlrilniywrciw}
spring.datasource.password=${DB_PASSWORD}

# 2. JPA / Hibernate: Flyway cria as tabelas e o Hibernate valida a estrutura
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# 3. Limite de tamanho para Upload de Arquivos (Planilhas, PDFs, Logos) = até 20MB
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# 4. Configurações de Segurança (JWT e Superadmin inicial da RBS)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiracao-horas=8

app.superadmin.email=${SUPERADMIN_EMAIL}
app.superadmin.nome=${SUPERADMIN_NOME:SuperAdmin RBS}
app.superadmin.senha=${SUPERADMIN_SENHA}

# 5. Configurações do Supabase Storage (Para o Passo 4)
app.supabase.url=https://jaohpsnvlrilniywrciw.supabase.co
app.supabase.bucket=arquivos-portal-patrocinador-pa
app.supabase.service-key=${SUPABASE_SERVICE_KEY}

# 6. Autoriza o Flyway a iniciar o histórico no schema "public" do Supabase e rodar desde a V1
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# 7. Ordenação visual do Swagger UI (Ordena as seções de 1 a 7 automaticamente!)
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha